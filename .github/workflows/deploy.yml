# Builds the site and publishes the built output to the `deploy` branch.
# The cPanel server then PULLS that branch — see docs/DEPLOYMENT.md.
#
# WHY PULL INSTEAD OF PUSH
# Two push-based attempts failed against this host:
#   - appleboy/scp-action (SCP over SSH, port 22) -> "connection refused".
#     The host runs no SSH at all.
#   - FTP-Deploy-Action (FTPS, port 21) -> "Timeout (control socket)".
#     Port 21 answers instantly from a normal connection but is dropped for
#     GitHub's runners, i.e. the host firewall (Hetzner/cPanel, typically CSF)
#     filters it by source IP.
# Outbound connections FROM the server are not filtered, so having cPanel pull
# from GitHub sidesteps the firewall entirely.
name: Build and Publish

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: 🚀 Build and Publish
    runs-on: ubuntu-latest

    # Required to push the built output to the deploy branch.
    permissions:
      contents: write

    # Surfaced as env because the `secrets` context is NOT available in a
    # step-level `if:` — checking secrets.* there silently evaluates empty.
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      CPANEL_REPO_ROOT: ${{ secrets.CPANEL_REPO_ROOT }}

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # npm ci respects package-lock.json exactly, so CI builds match local ones.
      - name: 📥 Install dependencies
        run: npm ci

      # Vite inlines VITE_* at build time and the Supabase client has no fallback:
      # createClient(undefined, undefined) throws "supabaseUrl is required" at module
      # load. A missing secret would therefore produce a build that passes CI and
      # then white-screens in production, so fail here instead.
      - name: 🔐 Check required secrets
        run: |
          missing=0
          [ -n "${{ secrets.VITE_SUPABASE_URL }}" ] || { echo "::error::Secret VITE_SUPABASE_URL is not set"; missing=1; }
          [ -n "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" ] || { echo "::error::Secret VITE_SUPABASE_PUBLISHABLE_KEY is not set"; missing=1; }
          exit $missing

      - name: 🔨 Build project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Fail loudly here rather than publishing a broken tree.
      # .htaccess drives SPA routing for /admin and /blog/:slug — without it
      # those deep links 404 on Apache.
      - name: ✅ Verify build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/.htaccess  || { echo "::error::dist/.htaccess missing — SPA deep links will 404"; exit 1; }
          echo "Build output:"
          ls -la dist/

      # Force-pushed orphan branch: it holds only the built site plus .cpanel.yml,
      # with no source history, so it stays small no matter how often we deploy.
      - name: 📤 Publish built site to `deploy` branch
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf .publish
          mkdir -p .publish/dist
          cp -R dist/. .publish/dist/
          cp .cpanel.yml .publish/.cpanel.yml

          cd .publish
          git init -q
          git checkout -q -b deploy
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            deploy
          echo "Published $(find dist -type f | wc -l) files to the deploy branch."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional immediate trigger. Only runs if you add the CPANEL_* secrets;
      # otherwise the server-side cron in docs/DEPLOYMENT.md picks the build up.
      # Soft-fails so a blocked port 2083 cannot fail an otherwise good build.
      - name: 🔔 Trigger cPanel deployment (optional)
        if: env.CPANEL_USER != '' && env.CPANEL_API_TOKEN != ''
        continue-on-error: true
        run: |
          host="${CPANEL_HOST:-tobiyastudio.com}"
          root="${CPANEL_REPO_ROOT:-repositories/tobiyagamestudio}"
          echo "Asking cPanel at $host to pull and deploy $root ..."
          curl -sS --max-time 90 --fail-with-body \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
            "https://${host}:2083/execute/VersionControlDeployment/create?repository_root=${root}" \
            || echo "::warning::cPanel trigger failed (port 2083 may be firewalled). The cron job will pick this build up instead."

      # Diagnostic only — records whether the firewall situation ever changes.
      - name: 🩺 Connectivity report (informational)
        continue-on-error: true
        run: |
          echo "Runner egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          echo "Port reachability from this runner:"
          echo "  21 = FTP/FTPS   22 = SSH   2083 = cPanel   2087 = WHM"
          for port in 21 22 443 2083 2087; do
            if timeout 12 bash -c "</dev/tcp/ftp.tobiyastudio.com/$port" 2>/dev/null; then
              echo "  port $port: OPEN"
            else
              echo "  port $port: REFUSED or FILTERED"
            fi
          done
