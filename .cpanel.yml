---
# cPanel Git Version Control deployment tasks.
#
# This file is copied onto the `deploy` branch by .github/workflows/deploy.yml.
# cPanel runs these tasks when you click "Deploy HEAD Commit" (or when the
# server-side cron in docs/DEPLOYMENT.md fires).
#
# The `deploy` branch contains the BUILT site under dist/ — cPanel shared hosting
# has no Node.js, so the build happens in GitHub Actions, not here.
#
# `./dist/.` (note the trailing /.) copies hidden files too. That matters:
# .htaccess drives SPA routing for /admin and /blog/:slug.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R ./dist/. $DEPLOYPATH/
    - /bin/echo "Deployed $(date -u +%Y-%m-%dT%H:%M:%SZ) to $DEPLOYPATH"
